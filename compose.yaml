services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen-inference

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./models:/models:ro

    command:
      - "-m"
      - "/models/qwen3-0.6b-q4_k_m.gguf"
      - "-c"
      - "2048"
      - "-t"
      - "4"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
