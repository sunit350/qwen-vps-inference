services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen-inference
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./models:/models:ro

    command:
      - --models-dir
      - /models
      - --models-max
      - "1"
      - --models-autoload
      - --ctx-size
      - "2048"
      - --threads
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
