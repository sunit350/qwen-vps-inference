name: Qwen Inference CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: python --version

      - name: Validate Python syntax
        run: python -m compileall -q app benchmarks tests

      - name: Validate Docker Compose
        run: docker compose -f compose.yaml config -q

      - name: Install gateway test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt pytest

      - name: Test FastAPI gateway
        run: python -m pytest tests/test_gateway.py -v

      - name: Build FastAPI Docker image
        run: docker build -f gateway/Dockerfile -t ai-gateway:ci .